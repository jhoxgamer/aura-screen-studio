<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Graphite Base Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#0B0E14" stroke="#303A4B" stroke-width="2" />
  
  <!-- Outer Screen Viewfinder Frame in Nocturne Blue -->
  <rect x="18" y="18" width="64" height="64" rx="14" fill="#121722" stroke="#78A5FF" stroke-width="4.5" />
  
  <!-- Precision Screen Corner Indicators -->
  <path d="M 26 36 L 26 26 L 36 26" stroke="#9AB9FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 74 36 L 74 26 L 64 26" stroke="#9AB9FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 26 64 L 26 74 L 36 74" stroke="#9AB9FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 74 64 L 74 74 L 64 74" stroke="#9AB9FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Studio Recording Core in Coral -->
  <circle cx="50" cy="50" r="14" fill="#FF647C" />
  <circle cx="50" cy="50" r="14" stroke="#101A32" stroke-width="2" />

  <!-- Crisp Core Accent -->
  <circle cx="45.5" cy="45.5" r="3.5" fill="#FFFFFF" opacity="0.9" />
</svg>
