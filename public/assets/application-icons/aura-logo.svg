<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Midnight Signal Gradients -->
    <linearGradient id="mintGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65E6D8" />
      <stop offset="50%" stop-color="#3AD6C6" />
      <stop offset="100%" stop-color="#12312F" />
    </linearGradient>

    <radialGradient id="signalHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3AD6C6" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#12312F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B1117" stop-opacity="0" />
    </radialGradient>

    <filter id="studioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
  </defs>

  <!-- Midnight Dark Base Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0B1117" stroke="#31414D" stroke-width="1.8" />

  <!-- Studio Ambient Halo -->
  <circle cx="50" cy="50" r="34" fill="url(#signalHalo)" filter="url(#studioGlow)" />

  <!-- Studio Framing Viewfinder Brackets in Signal Mint -->
  <path d="M 22 34 L 22 22 L 34 22" stroke="#3AD6C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 78 34 L 78 22 L 66 22" stroke="#3AD6C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 22 66 L 22 78 L 34 78" stroke="#3AD6C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 78 66 L 78 78 L 66 78" stroke="#3AD6C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Signal Mint Capture Ring -->
  <circle cx="50" cy="50" r="24" stroke="url(#mintGradient)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="140 10" />

  <!-- Central Recording Core in Coral -->
  <circle cx="50" cy="50" r="11" fill="#FF5F6D" />
  <circle cx="50" cy="50" r="11" stroke="#2B0E13" stroke-width="1.5" />

  <!-- Specular Lens Glint -->
  <circle cx="46.5" cy="46.5" r="2.8" fill="#FFFFFF" opacity="0.9" />
</svg>
